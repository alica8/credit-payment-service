name: credit-payments
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: credit
      POSTGRES_PASSWORD: credit_local
      POSTGRES_DB: credit
    ports: ['127.0.0.1:5432:5432']
    volumes: ['postgres-data:/var/lib/postgresql/data']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U credit -d credit']
      interval: 5s
      timeout: 5s
      retries: 20
  rabbitmq:
    image: rabbitmq:4-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: credit
      RABBITMQ_DEFAULT_PASS: credit_local
    ports: ['127.0.0.1:5672:5672', '127.0.0.1:15672:15672']
    volumes: ['rabbit-data:/var/lib/rabbitmq']
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', '-q', 'ping']
      interval: 5s
      timeout: 10s
      retries: 30
  redis:
    image: redis:7-alpine
    ports: ['127.0.0.1:6379:6379']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 20
  migrate:
    build: .
    environment:
      DATABASE_URL: postgresql://credit:credit_local@postgres:5432/credit?schema=public
    command: ['npm', 'run', 'db:migrate']
    depends_on:
      postgres: { condition: service_healthy }
  api:
    build: .
    init: true
    environment: &app-env
      DATABASE_URL: postgresql://credit:credit_local@postgres:5432/credit?schema=public
      RABBITMQ_URL: amqp://credit:credit_local@rabbitmq:5672
      REDIS_URL: redis://redis:6379
      API_KEY: ${API_KEY:-local-development-key-change-me}
      MAX_ATTEMPTS: ${MAX_ATTEMPTS:-3}
      RETRY_BASE_MS: ${RETRY_BASE_MS:-1000}
      DISPATCH_INTERVAL_MS: ${DISPATCH_INTERVAL_MS:-1000}
      REPUBLISH_AFTER_MS: ${REPUBLISH_AFTER_MS:-10000}
      WORKER_PREFETCH: ${WORKER_PREFETCH:-8}
      RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-120}
      SIMULATION_ENABLED: ${SIMULATION_ENABLED:-false}
      SIMULATION_SCALE_AMOUNT: ${SIMULATION_SCALE_AMOUNT:-100000}
    ports: ['127.0.0.1:3000:3000']
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:3000/readyz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
  worker:
    build: .
    init: true
    environment: *app-env
    command: ['npm', 'run', 'worker']
    depends_on:
      migrate: { condition: service_completed_successfully }
      rabbitmq: { condition: service_healthy }
    stop_grace_period: 30s
    restart: unless-stopped
volumes:
  postgres-data:
  rabbit-data:
